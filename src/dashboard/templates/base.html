<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Hermes{% endblock %} — Wellness Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  {% block head %}{% endblock %}
</head>
<body class="bg-gray-50 min-h-screen text-gray-900">

  <!-- Top nav -->
  <nav class="bg-indigo-700 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2 font-bold text-lg tracking-wide">
        <span class="text-2xl">🪶</span> Hermes
        <span class="text-indigo-300 text-sm font-normal">Wellness Dashboard</span>
      </a>
      <div class="flex gap-6 text-sm font-medium">
        <a href="/" class="hover:text-indigo-200 transition">Seniors</a>
        <a href="/review" class="hover:text-indigo-200 transition">Review Queue</a>
        <a href="/schedule" class="hover:text-indigo-200 transition">Schedule</a>
      </div>
    </div>
  </nav>

  <!-- Page content -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
